#------------------------------------------------------------------------------
# SPEC CPU(R) 2026 MemProf config for LLVM on Linux x86_64
#------------------------------------------------------------------------------

#--------- Label --------------------------------------------------------------

%define label mytest
%define bits 64

%ifndef %{build_ncpus}
%   define build_ncpus 16
%endif

label = %{label}-m%{bits}


#--------- Global Settings ----------------------------------------------------

default:
   bench_post_setup     = sync
   command_add_redirect = 1
   flagsurl             = $[top]/config/flags/llvm.xml
   ignore_errors        = 1
   iterations           = 1
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = --jobs=%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,html,cfg,pdf,csv
   preenv               = 1
   reportable           = 0
   tune                 = base

   copies               = 1
   threads              = 4

# MemProf produces memprof.profraw.* files in the run directory.
strict_rundir_verify = 0


#------- Compilers ------------------------------------------------------------

default:

   # This line is replaced by build_spec26() in the run script:
   #
   # sed -i \
   #   "s|^[[:space:]]*LLVM_PATH[[:space:]]*=.*|LLVM_PATH = ${TOP_DIR}/third_party/llvm-project/|" \
   #   "${SPEC_26_DIR}/config/memprof26.cfg"
   #
   LLVM_PATH          = <path-to-llvm>

   LLVM_ROOT_PATH     = $[LLVM_PATH]/build
   LLVM_BIN_PATH      = $[LLVM_ROOT_PATH]/bin
   LLVM_LIB_PATH      = $[LLVM_ROOT_PATH]/lib
   LLVM_INCLUDE_PATH  = $[LLVM_ROOT_PATH]/include

   preENV_PATH             = $[LLVM_BIN_PATH]:%{ENV_PATH}
   preENV_LIBRARY_PATH     = $[LLVM_LIB_PATH]
   preENV_LD_LIBRARY_PATH  = $[LLVM_LIB_PATH]

   CC                  = $(LLVM_BIN_PATH)/clang   -std=c18
   CXX                 = $(LLVM_BIN_PATH)/clang++ -std=c++17
   FC                  = $(LLVM_BIN_PATH)/flang   -std=f2018

   CC_VERSION_OPTION   = --version
   CXX_VERSION_OPTION  = --version
   FC_VERSION_OPTION   = --version


#--------- Pointer Size -------------------------------------------------------

default:
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = 64-bit


#--------- Portability --------------------------------------------------------

710.omnetpp_r:
   PORTABILITY = -fno-finite-math-only

734.vpr_r,834.vpr_s:
   PORTABILITY = -fno-finite-math-only

735.gem5_r,835.gem5_s:
   PORTABILITY = -fno-finite-math-only

736.ocio_r:
   PORTABILITY = -fno-finite-math-only

737.gmsh_r:
   PORTABILITY = -fno-fast-math

748.flightdm_r:
   PORTABILITY = -fno-fast-math

753.ns3_r,853.ns3_s:
   PORTABILITY = -fno-finite-math-only

767.nest_r,867.nest_s:
   PORTABILITY      = -fno-finite-math-only
   PORTABILITY_LIBS = -lstdc++fs


#--------- SPEC CPU 2026 Common Flags -----------------------------------------

intspeed,fpspeed:
   preENV_OMP_STACKSIZE = 120M

doconcurrent:
   # Intentionally left without DO CONCURRENT -> OpenMP conversion.

openmp:
   EXTRA_OPTIMIZE = -fopenmp -DSPEC_OPENMP

cxxthreads:
   EXTRA_OPTIMIZE = -pthread


#--------- MemProf Flags ------------------------------------------------------
#
# These are custom specmake variables.
#
# IMPORTANT:
#
#     $(MEMPROF_COMPILE_FLAGS)
#     $(MEMPROF_LINK_FLAGS)
#
# must use $(...) because they are expanded by specmake.
#
# Do NOT use:
#
#     $[MEMPROF_COMPILE_FLAGS]
#
# $[...] is runcpu startup-time variable substitution.
#
# Compile-time instrumentation:
#
#   -g
#   -fstandalone-debug
#       Preserve complete DWARF type information.
#
#   -fdebug-info-for-profiling
#       Emit profiling-friendly debug information.
#
#   -fno-omit-frame-pointer
#   -mno-omit-leaf-frame-pointer
#   -fno-optimize-sibling-calls
#       Preserve call stacks for MemProf.
#
#   -fmemory-profile=.
#       Enable MemProf and write profiles to the benchmark run directory.
#
#   -fprofile-generate=.
#       Enable instrumentation PGO and write profiles to the run directory.
#
#   -mllvm -memprof-histogram
#       Enable MemProf access histograms.
#
# Binary/link layout:
#
#   -fno-pie
#   -no-pie
#   -Wl,--no-rosegment
#   -Wl,-build-id
#

default:

   MEMPROF_COMPILE_FLAGS = \
      -g \
      -fstandalone-debug \
      -fdebug-info-for-profiling \
      -mno-omit-leaf-frame-pointer \
      -fno-omit-frame-pointer \
      -fno-optimize-sibling-calls \
      -m64 \
      -fno-pie \
      -fmemory-profile=. \
      -fprofile-generate=. 
      # -mllvm -memprof-histogram

   MEMPROF_LINK_FLAGS = \
      -fuse-ld=lld \
      -Wl,--no-rosegment \
      -m64 \
      -fno-pie \
      -no-pie \
      -Wl,-build-id \
      -fmemory-profile=. \
      -fprofile-generate=.


#-------- Base Tuning Flags ---------------------------------------------------

default=base:

   COPTIMIZE     = $(MEMPROF_COMPILE_FLAGS) -O2
   CXXOPTIMIZE   = $(MEMPROF_COMPILE_FLAGS) -O2

   # Do not pass Clang MemProf-specific options to Flang.
   FOPTIMIZE     = -g -O2

   LDOPTIMIZE    = $(MEMPROF_LINK_FLAGS)


#-------- Peak Tuning Flags ---------------------------------------------------
#
# This MemProf configuration is intended primarily for base runs.
#

default:
   basepeak = yes

default=peak:

   COPTIMIZE     = $(MEMPROF_COMPILE_FLAGS) -O2
   CXXOPTIMIZE   = $(MEMPROF_COMPILE_FLAGS) -O2

   FOPTIMIZE     = -g -O2

   LDOPTIMIZE    = $(MEMPROF_LINK_FLAGS)


